<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autsnoboy Music Test</title>
</head>

<body style="text-align:center; padding-top:50px; font-family:Arial;">

<h2>🎵 Autsnoboy Flute Music</h2>

<button
    onclick="playMusic()"
    style="font-size:20px;padding:15px 25px;">
    🎵 PLAY FLUTE
</button>

<button
    onclick="stopMusic()"
    style="font-size:20px;padding:15px 25px;">
    🔇 STOP
</button>

<audio
    id="flute"
    controls
    preload="auto"
    loop
    src="bmdkbandara-whispers-of-the-stream-417622.mp3">
</audio>

<script>

const flute = document.getElementById("flute");

function playMusic() {
    flute.volume = 0.30;

    flute.play()
    .then(function() {
        alert("🎵 Flute Music Started");
    })
    .catch(function(error) {
        alert("Music Error: " + error.message);
    });
}

function stopMusic() {
    flute.pause();
}

</script>

</body>
</html>
