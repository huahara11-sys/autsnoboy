<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Autsnoboy - Learning Adventure</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#eef4ff,#fff8e7);
    color:#222;
    text-align:center;
}

.header{
    background:linear-gradient(135deg,#6257e8,#8b7cff);
    color:white;
    padding:18px 12px;
    border-radius:0 0 25px 25px;
}

.logo{
    width:110px;
    height:110px;
    object-fit:contain;
    border-radius:25px;
    background:white;
    padding:5px;
}

h1{
    margin:8px 0 4px;
    font-size:32px;
}

.owner{
    font-size:14px;
    opacity:.9;
}

.container{
    max-width:700px;
    margin:auto;
    padding:18px;
}

.controls{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

button{
    border:none;
    border-radius:15px;
    padding:13px 18px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    background:#6257e8;
    color:white;
    box-shadow:0 4px 10px rgba(0,0,0,.12);
}

button:active{
    transform:scale(.96);
}

.lang{
    background:#222;
}

.music{
    background:#159957;
}

.card{
    background:white;
    border-radius:25px;
    padding:25px 18px;
    margin-top:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.mission-title{
    font-size:25px;
    font-weight:bold;
    margin-bottom:10px;
}

.instruction{
    font-size:20px;
    margin-bottom:18px;
    line-height:1.4;
}

.choices{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.choice{
    min-height:100px;
    font-size:23px;
    background:#f5f5ff;
    color:#222;
    border:3px solid transparent;
}

.choice:hover{
    border-color:#6257e8;
}

.feedback{
    min-height:45px;
    margin-top:18px;
    font-size:21px;
    font-weight:bold;
}

.progress{
    margin-top:15px;
    font-size:15px;
    color:#666;
}

.badges{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:18px;
}

.badge{
    background:#fff4c4;
    border-radius:20px;
    padding:8px 12px;
    font-size:14px;
}

.next{
    background:#159957;
    margin-top:10px;
    display:none;
}

.restart{
    background:#e85d75;
    margin-top:10px;
}

.hidden{
    display:none;
}

.footer{
    padding:25px;
    color:#777;
    font-size:13px;
}

@media(max-width:500px){
    h1{font-size:27px}
    .instruction{font-size:18px}
    .choice{font-size:20px;min-height:90px}
    button{font-size:15px}
}
</style>

</head>

<body>

<div class="header">

```
<img src="autsnoboy.png" class="logo" alt="Autsnoboy">

<h1>🦸 Autsnoboy</h1>

<div class="owner">
    Learning Adventure • Owned & Developed by Varun Mamta
</div>
```

</div>

<div class="container">

```
<div class="controls">

    <button class="lang" onclick="toggleLanguage()">
        🇬🇧 English / 🇮🇳 हिंदी
    </button>

    <button class="music" onclick="toggleMusic()" id="musicBtn">
        🎵 Music ON
    </button>

</div>

<div class="card">

    <div class="mission-title" id="missionTitle">
        Mission 1
    </div>

    <div class="instruction" id="instruction">
        Find the RED object
    </div>

    <div class="choices" id="choices"></div>

    <div class="feedback" id="feedback"></div>

    <div class="progress" id="progress">
        Mission 1 of 7
    </div>

    <button class="next" id="nextBtn" onclick="nextMission()">
        ➡️ Next Mission
    </button>

    <button class="restart" onclick="restartGame()">
        🔄 Start Again
    </button>

</div>

<div class="badges" id="badges"></div>
```

</div>

<div class="footer">
    A fun learning experience for children 🌟
</div>

<script>

/* =========================

========================= */

let currentMission = 0;
let musicOn = true;
let answered = false;

const missions = [

        {emoji:"🔴",en:"Red",hi:"लाल",correct:true},
        {emoji:"🟢",en:"Green",hi:"हरा",correct:false},
        {emoji:"🟡",en:"Yellow",hi:"पीला",correct:false}
    ]
},

{

    enInstruction:"Find the SAME pair 👀",
    hiInstruction:"एक जैसी जोड़ी 👀 ढूंढो",

    choices:[
        {emoji:"🍎🍌",en:"Different",hi:"अलग",correct:false},
        {emoji:"🐶🐱",en:"Different",hi:"अलग",correct:false},
        {emoji:"⭐⭐",en:"Same",hi:"एक जैसी",correct:true},
        {emoji:"🚗🚌",en:"Different",hi:"अलग",correct:false}
    ]
},

{
    enTitle:"Mission 3 — Pattern Star",
    hiTitle:"मिशन 3 — पैटर्न स्टार",

    enInstruction:"What comes next? 🔴 🔵 🔴 🔵 ?",
    hiInstruction:"इसके बाद क्या आएगा? 🔴 🔵 🔴 🔵 ?",

    choices:[
        {emoji:"🔴",en:"Red",hi:"लाल",correct:false},
        {emoji:"🟢",en:"Green",hi:"हरा",correct:false},
        {emoji:"🔵",en:"Blue",hi:"नीला",correct:true},
        {emoji:"🟡",en:"Yellow",hi:"पीला",correct:false}
    ]
},

{
    enTitle:"Mission 4 — Feelings Explorer",
    hiTitle:"मिशन 4 — भावनाओं का खोजकर्ता",

    enInstruction:"Autsnoboy got a gift! How does he feel? 😊",
    hiInstruction:"Autsnoboy को gift मिला! वह कैसा महसूस करेगा? 😊",

    choices:[
        {emoji:"😢",en:"Sad",hi:"उदास",correct:false},
        {emoji:"😡",en:"Angry",hi:"गुस्सा",correct:false},
        {emoji:"😊",en:"Happy",hi:"खुश",correct:true},
        {emoji:"😴",en:"Sleepy",hi:"नींद",correct:false}
    ]
},

{
    enTitle:"Mission 5 — Little Communicator",
    hiTitle:"मिशन 5 — छोटा कम्युनिकेटर",

    enInstruction:"What can you say when you need help? 🗣️",
    hiInstruction:"जब आपको मदद चाहिए तो क्या कह सकते हैं? 🗣️",

    choices:[
        {emoji:"🙋",en:"Help me",hi:"मेरी मदद करो",correct:true},
        {emoji:"😴",en:"Sleep",hi:"सोना",correct:false},
        {emoji:"🏃",en:"Run",hi:"दौड़ना",correct:false},
        {emoji:"🎵",en:"Music",hi:"संगीत",correct:false}
    ]
},

{
    enTitle:"Mission 6 — Daily Hero",
    hiTitle:"मिशन 6 — डेली हीरो",

    enInstruction:"What do we do before eating? 🧼",
    hiInstruction:"खाना खाने से पहले क्या करते हैं? 🧼",

    choices:[
        {emoji:"🛌",en:"Sleep",hi:"सोते हैं",correct:false},
        {emoji:"🧼",en:"Wash hands",hi:"हाथ धोते हैं",correct:true},
        {emoji:"📺",en:"Watch TV",hi:"टीवी देखते हैं",correct:false},
        {emoji:"🏃",en:"Run",hi:"दौड़ते हैं",correct:false}
    ]
},

{
    enTitle:"Mission 7 — Friendship Hero",
    hiTitle:"मिशन 7 — फ्रेंडशिप हीरो",

    enInstruction:"Your friend is playing. What should you do? 🤝",
    hiInstruction:"आपका दोस्त खेल रहा है। आपको क्या करना चाहिए? 🤝",

    choices:[
        {emoji:"😡",en:"Push",hi:"धक्का देना",correct:false},
        {emoji:"🤝",en:"Take turns",hi:"बारी-बारी से खेलना",correct:true},
        {emoji:"😭",en:"Cry",hi:"रोना",correct:false},
        {emoji:"🚶",en:"Go away",hi:"दूर जाना",correct:false}
    ]
}

];


/* =========================
   AUDIO
========================= */

let audioContext = null;

function getAudioContext(){

    if(!audioContext){

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioContext) return null;

        audioContext = new AudioContext();
    }

    if(audioContext.state === "suspended"){
        audioContext.resume();
    }

    return audioContext;
}


/* =========================
   REALISTIC CLAPPING
========================= */

function clapSound(){

    if(!musicOn) return;

    const ctx = getAudioContext();

    if(!ctx) return;

    const now = ctx.currentTime;


    /* MANY SHORT CLAPS */

    for(let i=0;i<35;i++){

        const time =
            now +
            (Math.random()*1.8);

        const bufferSize =
            ctx.sampleRate * 0.08;

        const buffer =
            ctx.createBuffer(
                1,
                bufferSize,
                ctx.sampleRate
            );

        const data =
            buffer.getChannelData(0);

        for(let j=0;j<bufferSize;j++){

            data[j] =
                (Math.random()*2-1) *
                Math.exp(-j/(ctx.sampleRate*0.018));
        }

        const source =
            ctx.createBufferSource();

        const filter =
            ctx.createBiquadFilter();

        const gain =
            ctx.createGain();

        source.buffer = buffer;

        filter.type = "bandpass";
        filter.frequency.value =
            1200 + Math.random()*1800;

        filter.Q.value = 0.8;

        gain.gain.setValueAtTime(
            0.001,
            time
        );

        gain.gain.exponentialRampToValueAtTime(
            0.22 + Math.random()*0.12,
            time+0.005
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            time+0.08
        );

        source.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        source.start(time);
        source.stop(time+0.09);
    }


    /* CROWD CHEER */

    for(let i=0;i<12;i++){

        const time =
            now +
            0.15 +
            Math.random()*1.3;

        const osc =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        osc.type = "sawtooth";

        osc.frequency.setValueAtTime(
            250 + Math.random()*350,
            time
        );

        osc.frequency.exponentialRampToValueAtTime(
            600 + Math.random()*500,
            time+0.45
        );

        gain.gain.setValueAtTime(
            0.001,
            time
        );

        gain.gain.exponentialRampToValueAtTime(
            0.045,
            time+0.08
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            time+0.5
        );

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(time);
        osc.stop(time+0.52);
    }

}


/* =========================
   VOICE
========================= */

function speak(text,language){

    if(!("speechSynthesis" in window))
        return;

    window.speechSynthesis.cancel();

    const voice =
        new SpeechSynthesisUtterance(text);

    voice.lang = language;
    voice.rate = 0.85;
    voice.pitch = 1.05;
    voice.volume = 1;

    window.speechSynthesis.speak(voice);
}


/* =========================
   SUCCESS
========================= */

function celebrate(){

    clapSound();

    if(hindi){

        speak(
            "शाबाश! बहुत अच्छा!",
            "hi-IN"
        );

    }else{

        speak(
            "Well done! Great job!",
            "en-IN"
        );
    }
}


/* =========================
   WRONG ANSWER
========================= */

function tryAgain(){

    if(hindi){

        speak(
            "फिर कोशिश करो। तुम कर सकते हो!",
            "hi-IN"
        );

    }else{

        speak(
            "Try again. You can do it!",
            "en-IN"
        );
    }
}


/* =========================
   LOAD MISSION
========================= */

function loadMission(){

    answered = false;

    const mission =
        missions[currentMission];

    document.getElementById("missionTitle")
        .innerText =
        hindi
        ? mission.hiTitle
        : mission.enTitle;

    document.getElementById("instruction")
        .innerText =
        hindi
        ? mission.hiInstruction
        : mission.enInstruction;

    document.getElementById("progress")
        .innerText =
        hindi
        ? "मिशन " +
          (currentMission+1) +
          " / " +
          missions.length
        :
        "Mission " +
        (currentMission+1) +
        " of " +
        missions.length;

    document.getElementById("feedback")
        .innerText = "";

    document.getElementById("nextBtn")
        .style.display = "none";

    const choices =
        document.getElementById("choices");

    choices.innerHTML = "";

    mission.choices.forEach(function(choice){

        const btn =
            document.createElement("button");

        btn.className = "choice";

        btn.innerHTML =
            choice.emoji +
            "<br>" +
            (
                hindi
                ? choice.hi
                : choice.en
            );

        btn.onclick =
            function(){

                checkAnswer(choice,btn);
            };

        choices.appendChild(btn);

    });

}


/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(choice,button){

    if(answered)
        return;

    if(choice.correct){

        answered = true;

        button.style.borderColor =
            "#159957";

        document.getElementById("feedback")
            .innerText =
            hindi
            ? "⭐ बहुत अच्छा! शाबाश!"
            : "⭐ Well done! Great job!";

        celebrate();

        document.getElementById("nextBtn")
            .style.display = "inline-block";

        showBadge();

    }else{

        button.style.borderColor =
            "#e85d75";

        document.getElementById("feedback")
            .innerText =
            hindi
            ? "💙 फिर कोशिश करो। तुम कर सकते हो!"
            : "💙 Try again. You can do it!";

        tryAgain();

        setTimeout(function(){

            button.style.borderColor =
                "transparent";

        },800);
    }

}


/* =========================
   NEXT MISSION
========================= */

function nextMission(){

    if(currentMission <
       missions.length-1){

        currentMission++;

        loadMission();

    }else{

        finishGame();

    }

}


/* =========================
   BADGES
========================= */

function showBadge(){

    const badgeList = [
        "🌱 I Tried",
        "🔍 Focus Explorer",
        "👀 Sharp Eyes",
        "🎵 Rhythm Star",
        "🗣️ Little Communicator",
        "😊 Feelings Explorer",
        "🤝 Friendship Hero",
        "⭐ Try-Again Champion"
    ];

    const badge =
        badgeList[
            Math.min(
                currentMission+1,
                badgeList.length-1
            )
        ];

    const div =
        document.createElement("div");

    div.className = "badge";

    div.innerText = badge;

    document
        .getElementById("badges")
        .appendChild(div);

}


/* =========================
   FINISH
========================= */

function finishGame(){

    document.getElementById("missionTitle")
        .innerText =
        hindi
        ? "🎉 मिशन पूरा!"
        : "🎉 Adventure Complete!";

    document.getElementById("instruction")
        .innerText =
        hindi
        ? "तुमने बहुत अच्छा किया! ⭐"
        : "You did a wonderful job! ⭐";

    document.getElementById("choices")
        .innerHTML =
        "<div style='font-size:70px'>🏆🌟🦸</div>";

    document.getElementById("feedback")
        .innerText =
        hindi
        ? "हर कोशिश मायने रखती है!"
        : "Every step counts!";

    clapSound();

    if(hindi){

        speak(
            "शाबाश! मिशन पूरा हो गया!",
            "hi-IN"
        );

    }else{

        speak(
            "Amazing! You completed the adventure!",
            "en-IN"
        );
    }

    document.getElementById("nextBtn")
        .style.display = "none";

}


/* =========================
   LANGUAGE TOGGLE
========================= */

function toggleLanguage(){

    hindi = !hindi;

    loadMission();

}


/* =========================
   MUSIC
========================= */

const backgroundMusic =
    new Audio(
        "bmdkbandara-whispers-of-the-stream-417622.mp3"
    );

backgroundMusic.loop = true;
backgroundMusic.volume = 0.22;


function startMusic(){

    if(!musicOn)
        return;

    backgroundMusic.play()
        .catch(function(){

            /* Browser may require
               user interaction first */
        });
}


function toggleMusic(){

    musicOn = !musicOn;

    const btn =
        document.getElementById("musicBtn");

    if(musicOn){

        btn.innerText =
            "🎵 Music ON";

        startMusic();

    }else{

        btn.innerText =
            "🔇 Music OFF";

        backgroundMusic.pause();

    }

}


/* =========================
   RESTART
========================= */

function restartGame(){

    currentMission = 0;

    document.getElementById("badges")
        .innerHTML = "";

    loadMission();

    startMusic();

}


/* =========================
   START AUDIO AFTER
   USER TOUCH
========================= */

document.addEventListener(
    "click",
    function(){

        getAudioContext();

        if(musicOn){
            startMusic();
        }

    },
    {once:true}
);


/* =========================
   START GAME
========================= */

loadMission();

</script>
