const flute =
document.getElementById("fluteMusic");


function startMusic(){

    if(!musicOn){
        return;
    }

    flute.volume = 0.35;

    const playPromise = flute.play();

    if(playPromise !== undefined){

        playPromise.catch(function(){

            console.log(
                "Music waiting for user interaction."
            );

        });

    }

}


function toggleMusic(){

    musicOn = !musicOn;

    const btn =
    document.getElementById("musicBtn");


    if(musicOn){

        btn.innerHTML =
        "🎵 Music ON";

        startMusic();

    }

    else{

        btn.innerHTML =

        flute.pause();

    }

}

function speak(text,lang){

    if(!("speechSynthesis" in window)){
        return;
    }

    window.speechSynthesis.cancel();


    const voice =
    new SpeechSynthesisUtterance(text);


    voice.lang = lang;

    voice.rate = 0.85;

    voice.pitch = 1;

    voice.volume = 1;


    window.speechSynthesis.speak(voice);

}


function questionVoice(){

    if(language === "en"){

}

}


/* ==============================
   CLAPPING SOUND
   GENERATED INSIDE BROWSER
============================== */

function clapSound(){

    try{

        const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


        if(!AudioContext){
            return;
        }


        const ctx =
        new AudioContext();


        if(ctx.state === "suspended"){
            ctx.resume();
        }


        function clap(){

            const buffer =
            ctx.createBuffer(
                1,
                ctx.sampleRate * 0.08,
                ctx.sampleRate
            );


            const data =
            buffer.getChannelData(0);


            for(
                let i = 0;
                i < data.length;
                i++
            ){

                data[i] =
                (Math.random() * 2 - 1)
                *
                (1 - i / data.length);

            }


            const source =
            ctx.createBufferSource();


            source.buffer = buffer;


            const gain =
            ctx.createGain();


            gain.gain.value = 0.7;


            source.connect(gain);

            gain.connect(ctx.destination);


            source.start();

        }


        clap();

        setTimeout(clap,120);

        setTimeout(clap,240);

        setTimeout(clap,360);

    }

    catch(error){

        console.log(
            "Clap sound unavailable"
        );

    }

}
