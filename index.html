<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autsnoboy - Learning Game</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#eef5ff,#fff8ef);
color:#222;
}

.app{
max-width:850px;
margin:auto;
padding:15px;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.brand{
display:flex;
align-items:center;
gap:12px;
}

.hero{
width:60px;
height:60px;
border-radius:16px;
object-fit:cover;
}

h1{
margin:0;
font-size:25px;
}

.sub{
font-size:13px;
color:#666;
margin-top:3px;
}

button{
font:inherit;
cursor:pointer;
}

.topbtn{
border:0;
background:white;
border-radius:13px;
padding:10px 12px;
box-shadow:0 3px 10px #0002;
}

.card{
background:white;
border-radius:22px;
padding:20px;
margin-top:17px;
box-shadow:0 6px 25px #0001;
}

.worlds{
display:grid;
grid-template-columns:1fr 1fr;
gap:13px;
}

.world{
background:white;
border:2px solid #e5e5e5;
border-radius:18px;
padding:18px;
text-align:left;
min-height:120px;
}

.world:hover{
border-color:#777;
}

.emoji{
font-size:34px;
}

.world b{
display:block;
margin-top:7px;
font-size:17px;
}

.world small{
color:#777;
}

.hidden{
display:none;
}

.prompt{
font-size:22px;
font-weight:bold;
text-align:center;
margin:22px 0;
}

.choices{
display:grid;
grid-template-columns:1fr 1fr;
gap:13px;
}

.choice{
background:#fafaff;
border:2px solid #ddd;
border-radius:20px;
padding:18px;
font-size:48px;
min-height:145px;
}

.choice span{
display:block;
font-size:18px;
font-weight:bold;
margin-top:10px;
}

.correct{
background:#e5f8ed!important;
border-color:#39a66f!important;
}

.wrong{
background:#fff0e5!important;
border-color:#e49a50!important;
}

.feedback{
text-align:center;
font-size:18px;
font-weight:bold;
min-height:32px;
margin:16px;
}

.primary{
background:#6657e8;
color:white;
border:0;
border-radius:13px;
padding:13px 20px;
}

.secondary{
background:white;
border:1px solid #ccc;
border-radius:13px;
padding:12px 18px;
}

.actions{
text-align:center;
margin-top:10px;
}

@media(max-width:520px){
.worlds,
.choices{
grid-template-columns:1fr 1fr;
}

.hero{
width:52px;
height:52px;
}
}
</style>
</head>

<body>

<div class="app">

<header>

<div class="brand">

<img
class="hero"
src="autsnoboy.png"
alt="Autsnoboy">

<div>

<h1>Autsnoboy</h1>

<div class="sub">
Learn • Play • Grow
</div>

</div>

</div>

<button
class="topbtn"
id="musicButton">
🎵 Flute ON
</button>

</header>


<div class="card">

<h2>Choose a Learning World</h2>

<div class="worlds">

<button
class="world"
onclick="startGame('focus')">

<div class="emoji">🎯</div>

<b>Focus Forest</b>

<small>
Attention & Finding
</small>

</button>


<button
class="world"
onclick="startGame('visual')">

<div class="emoji">🌈</div>

<b>Color City</b>

<small>
Colours & Matching
</small>

</button>


<button
class="world"
onclick="startGame('communication')">

<div class="emoji">💬</div>

<b>Word Village</b>

<small>
Communication
</small>

</button>


<button
class="world"
onclick="startGame('emotion')">

<div class="emoji">😊</div>

<b>Emotion Island</b>

<small>
Feelings
</small>

</button>

</div>

</div>


<div
class="card hidden"
id="game">

<h3 id="mission">
Mission 1
</h3>

<div
class="prompt"
id="question">
Choose an option
</div>


<div style="text-align:center">

<button
class="secondary"
onclick="speakInstruction()">

🔊 Hear Instruction

</button>

</div>


<div
class="choices"
id="choices">
</div>


<div
class="feedback"
id="feedback">
</div>


<div class="actions">

<button
class="primary hidden"
id="nextButton"
onclick="nextQuestion()">

Next Mission ⭐

</button>


<button
class="secondary hidden"
id="retryButton"
onclick="retryQuestion()">

Try Again 🔄

</button>

</div>

</div>


<div class="card">

<b>Every Step Counts ❤️</b>

<p style="color:#666">

No grades. No failure.
Just learning, trying and growing.

</p>

</div>

</div>


<script>

/* ==================================================
   AUTSNOBOY CALMING FLUTE MUSIC
   ================================================== */

let audioContext = null;
let masterGain = null;
let musicTimer = null;
let musicPlaying = false;

let melodyIndex = 0;


/*
   A soft pentatonic flute melody.
   These are musical frequencies, not beeps.
*/

const melody = [

293.66,   // D4
329.63,   // E4
392.00,   // G4
440.00,   // A4
493.88,   // B4

440.00,
392.00,
329.63,

293.66,
329.63,
392.00,
440.00,

392.00,
329.63,
293.66,

261.63,
293.66,
329.63,
392.00,

329.63,
293.66

];


/*
   Create audio system
*/

function createAudio(){

if(audioContext)
return;

const AudioClass =
window.AudioContext ||
window.webkitAudioContext;

if(!AudioClass)
return;

audioContext =
new AudioClass();


masterGain =
audioContext.createGain();


masterGain.gain.value =
0.055;


masterGain.connect(
audioContext.destination
);

}


/*
   Create one flute note
*/

function playFluteNote(){

if(!audioContext)
return;


/* Main flute oscillator */

const oscillator =
audioContext.createOscillator();


/* Soft harmonic oscillator */

const harmonic =
audioContext.createOscillator();


/* Breath / flute body */

const gain =
audioContext.createGain();


const harmonicGain =
audioContext.createGain();


oscillator.type =
"sine";


harmonic.type =
"sine";


const frequency =
melody[melodyIndex];


melodyIndex++;

if(
melodyIndex >= melody.length
){
melodyIndex=0;
}


/*
   Very small natural vibrato
*/

const vibrato =
audioContext.createOscillator();

const vibratoGain =
audioContext.createGain();

vibrato.frequency.value =
5.2;

vibratoGain.gain.value =
2.0;

vibrato.connect(
vibratoGain
);

vibratoGain.connect(
oscillator.frequency
);

oscillator.frequency.value =
frequency;

harmonic.frequency.value =
frequency * 2;


/*
   Soft volume
*/

gain.gain.setValueAtTime(
0.0001,
audioContext.currentTime
);

gain.gain.linearRampToValueAtTime(
0.32,
audioContext.currentTime + 0.35
);

gain.gain.exponentialRampToValueAtTime(
0.0001,
audioContext.currentTime + 2.8
);


/*
   Harmonic volume
*/

harmonicGain.gain.setValueAtTime(
0.0001,
audioContext.currentTime
);

harmonicGain.gain.linearRampToValueAtTime(
0.07,
audioContext.currentTime + 0.35
);

harmonicGain.gain.exponentialRampToValueAtTime(
0.0001,
audioContext.currentTime + 2.8
);


oscillator.connect(gain);

gain.connect(
masterGain
);


harmonic.connect(
harmonicGain
);

harmonicGain.connect(
masterGain
);


oscillator.start();

harmonic.start();

vibrato.start();


oscillator.stop(
audioContext.currentTime + 3
);

harmonic.stop(
audioContext.currentTime + 3
);

vibrato.stop(
audioContext.currentTime + 3
);

}


/*
   Start calming flute
*/

async function startMusic(){

try{

createAudio();

if(!audioContext)
return;

if(
audioContext.state === "suspended"
){

await audioContext.resume();

}


if(musicPlaying)
return;


musicPlaying=true;


/*
   First note immediately
*/

playFluteNote();


/*
   Slow musical spacing.
   This prevents dot/beep effect.
*/

musicTimer =
setInterval(
playFluteNote,
3000
);


document.getElementById(
"musicButton"
).textContent =
"🎵 Flute ON";

}
catch(error){

console.log(error);

}

}


/*
   Stop music
*/

function stopMusic(){

if(musicTimer){

clearInterval(
musicTimer
);

musicTimer=null;

}

musicPlaying=false;

document.getElementById(
"musicButton"
).textContent =
"🔇 Flute OFF";

}


/*
   Music button
*/

document.getElementById(
"musicButton"
).onclick =
function(event){

event.stopPropagation();

if(musicPlaying){

stopMusic();

}
else{

startMusic();

}

};


/*
   Mobile browsers require
   user interaction for audio.
*/

document.addEventListener(
"pointerdown",
function(){

startMusic();

},
{
once:true
}
);


/*
   Also support touch
*/

document.addEventListener(
"touchstart",
function(){

startMusic();

},
{
once:true,
passive:true
}
);


/* ==================================================
   GAME DATA
   ================================================== */

const games = {

focus:[

[
"Find the RED object",
"🔴",
"Red",
"🔵",
"Blue"
],

[
"Find the STAR",
"⭐",
"Star",
"❤️",
"Heart"
],

[
"Find the DOG",
"🐶",
"Dog",
"🐱",
"Cat"
]

],


visual:[

[
"Choose RED",
"🔴",
"Red",
"🟢",
"Green"
],

[
"Choose BLUE",
"🔵",
"Blue",
"🟡",
"Yellow"
],

[
"Choose CIRCLE",
"⚪",
"Circle",
"⬛",
"Square"
]

],


communication:[

[
"Choose HELP",
"🙋",
"Help",
"🛑",
"Stop"
],

[
"Choose MORE",
"➕",
"More",
"✅",
"Finished"
],

[
"Choose APPLE",
"🍎",
"Apple",
"🧸",
"Toy"
]

],


emotion:[

[
"Choose HAPPY",
"😊",
"Happy",
"😢",
"Sad"
],

[
"Choose ANGRY",
"😡",
"Angry",
"😌",
"Calm"
],

[
"Choose SCARED",
"😨",
"Scared",
"😊",
"Happy"
]

]

};


let currentWorld = "";
let currentQuestion = 0;
let answered = false;


/*
   Start game
*/

function startGame(world){

currentWorld =
world;

currentQuestion =
0;


/*
   User has interacted,
   so start music.
*/

startMusic();


document.getElementById(
"game"
).classList.remove(
"hidden"
);


loadQuestion();

}


/*
   Load question
*/

function loadQuestion(){

const question =
games[currentWorld]
[
currentQuestion %
games[currentWorld].length
];


document.getElementById(
"mission"
).textContent =
"Mission " +
(currentQuestion + 1);


document.getElementById(
"question"
).textContent =
question[0];


document.getElementById(
"feedback"
).textContent =
"";


document.getElementById(
"nextButton"
).classList.add(
"hidden"
);


document.getElementById(
"retryButton"
).classList.add(
"hidden"
);


answered=false;


const choices =
document.getElementById(
"choices"
);


choices.innerHTML="";


/*
   Correct answer first
*/

createChoice(
question[1],
question[2],
true
);


createChoice(
question[3],
question[4],
false
);

}


/*
   Create choice button
*/

function createChoice(
emoji,
name,
correct
){

const button =
document.createElement(
"button"
);


button.className =
"choice";


button.innerHTML =
emoji +
"<span>" +
name +
"</span>";


button.onclick =
function(){

checkAnswer(
button,
correct
);

};


document.getElementById(
"choices"
).appendChild(
button
);

}


/*
   Check answer
*/

function checkAnswer(
button,
correct
){

if(answered)
return;


answered=true;


if(correct){

button.classList.add(
"correct"
);


document.getElementById(
"feedback"
).textContent =
"⭐ Great job! You did it!";


document.getElementById(
"nextButton"
).classList.remove(
"hidden"
);

}
else{

button.classList.add(
"wrong"
);


document.getElementById(
"feedback"
).textContent =
"Good try! Try again. You can do it!";


document.getElementById(
"retryButton"
).classList.remove(
"hidden"
);

}

}


/*
   Next question
*/

function nextQuestion(){

currentQuestion++;

loadQuestion();

}


/*
   Retry
*/

function retryQuestion(){

loadQuestion();

}


/*
   Speak instruction
*/

function speakInstruction(){

if(!currentWorld)
return;


const question =
games[currentWorld]
[
currentQuestion %
games[currentWorld].length
][0];


if(
window.speechSynthesis
){

speechSynthesis.cancel();


const speech =
new SpeechSynthesisUtterance(
question
);


speech.lang =
"en-IN";


speech.rate =
0.78;


speech.pitch =
1;


speechSynthesis.speak(
speech
);

}

}

</script>

</body>
</html>
