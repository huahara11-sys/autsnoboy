<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autsnoboy - Learning Game</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6ff;
color:#222
}
.app{
max-width:850px;
margin:auto;
padding:15px
}
header{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}
.brand{
display:flex;
align-items:center;
gap:12px
}
.hero{
width:60px;
height:60px;
object-fit:cover;
border-radius:15px
}
h1{margin:0;font-size:25px}
.sub{color:#666;font-size:13px}
button{
font:inherit;
cursor:pointer
}
.topbtn{
border:0;
background:white;
border-radius:12px;
padding:10px;
box-shadow:0 2px 8px #0001
}
.card{
background:white;
border-radius:20px;
padding:18px;
margin-top:16px;
box-shadow:0 5px 20px #0001
}
.worlds{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px
}
.world{
border:2px solid #eee;
background:#fff;
border-radius:18px;
padding:18px;
text-align:left;
min-height:115px
}
.world .emoji{
font-size:32px
}
.world b{
display:block;
margin-top:7px
}
.prompt{
font-size:21px;
font-weight:bold;
text-align:center;
margin:20px 0
}
.choices{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}
.choice{
background:#fafaff;
border:2px solid #ddd;
border-radius:18px;
padding:18px;
font-size:42px;
min-height:130px
}
.choice span{
display:block;
font-size:18px;
font-weight:bold;
margin-top:8px
}
.correct{
background:#e5f8ed;
border-color:#35a66f
}
.wrong{
background:#fff0e5;
border-color:#e59b54
}
.feedback{
text-align:center;
font-size:18px;
font-weight:bold;
min-height:30px;
margin:15px
}
.primary{
background:#6657e8;
color:white;
border:0;
border-radius:12px;
padding:13px 20px
}
.secondary{
background:white;
border:1px solid #ddd;
border-radius:12px;
padding:12px 18px
}
.actions{
text-align:center;
margin-top:10px
}
.hidden{display:none}
@media(max-width:500px){
.worlds{grid-template-columns:1fr 1fr}
.choices{grid-template-columns:1fr 1fr}
.hero{width:50px;height:50px}
}
</style>
</head>

<body>

<div class="app">

<header>

<div class="brand">
<img class="hero" src="autsnoboy.png">
<div>
<h1>Autsnoboy</h1>
<div class="sub">Learn • Play • Grow</div>
</div>
</div>

<div>
<button class="topbtn" id="fluteBtn">🎵 Flute: ON</button>
<button class="topbtn" id="langBtn">हिन्दी</button>
</div>

</header>


<div class="card">

<h2 id="title">Choose a Learning World</h2>

<div class="worlds">

<button class="world" data-world="focus">
<div class="emoji">🎯</div>
<b>Focus Forest</b>
<small>Attention & finding</small>
</button>

<button class="world" data-world="visual">
<div class="emoji">🌈</div>
<b>Color City</b>
<small>Colours & matching</small>
</button>

<button class="world" data-world="communication">
<div class="emoji">💬</div>
<b>Word Village</b>
<small>Communication</small>
</button>

<button class="world" data-world="emotion">
<div class="emoji">😊</div>
<b>Emotion Island</b>
<small>Feelings</small>
</button>

</div>
</div>


<div class="card hidden" id="game">

<h2 id="mission">Mission 1</h2>

<div class="prompt" id="question">
Choose an option
</div>

<div style="text-align:center">
<button class="secondary" id="speakBtn">
🔊 Hear Instruction
</button>
</div>

<div class="choices" id="choices"></div>

<div class="feedback" id="feedback"></div>

<div class="actions">

<button class="primary hidden" id="nextBtn">
Next Mission ⭐
</button>

<button class="secondary hidden" id="retryBtn">
Try Again 🔄
</button>

</div>

</div>


<div class="card">
<b>Every Step Counts ❤️</b>
<p style="color:#666">
No grades. No failure. Just learning, trying and growing.
</p>
</div>

</div>


<script>

/* =====================================================
   AUTSNOBOY BACKGROUND FLUTE
   No external audio file required
   ===================================================== */

let audioContext=null;
let masterGain=null;
let fluteTimer=null;
let fluteOn=false;
let noteIndex=0;

const notes=[
261.63,
293.66,
329.63,
392.00,
329.63,
293.66,
261.63,
220.00
];


function setupFlute(){

if(audioContext)return;

const AudioCtx=
window.AudioContext||
window.webkitAudioContext;

if(!AudioCtx)return;

audioContext=new AudioCtx();

masterGain=
audioContext.createGain();

masterGain.gain.value=0.035;

masterGain.connect(
audioContext.destination
);

}


function playNote(){

if(!audioContext)return;

const osc=
audioContext.createOscillator();

const gain=
audioContext.createGain();

osc.type="sine";

osc.frequency.value=
notes[noteIndex];

noteIndex=
(noteIndex+1)%notes.length;

const now=
audioContext.currentTime;

gain.gain.setValueAtTime(
0.0001,
now
);

gain.gain.linearRampToValueAtTime(
0.5,
now+0.08
);

gain.gain.exponentialRampToValueAtTime(
0.0001,
now+0.8
);

osc.connect(gain);

gain.connect(masterGain);

osc.start(now);

osc.stop(now+0.85);

}


async function startFlute(){

try{

setupFlute();

if(!audioContext)return;

if(audioContext.state==="suspended"){
await audioContext.resume();
}

if(fluteOn)return;

fluteOn=true;

playNote();

fluteTimer=
setInterval(
playNote,
900
);

document.getElementById(
"fluteBtn"
).textContent="🎵 Flute: ON";

}catch(e){

console.log(e);

}

}


function stopFlute(){

if(fluteTimer){
clearInterval(fluteTimer);
fluteTimer=null;
}

fluteOn=false;

document.getElementById(
"fluteBtn"
).textContent="🔇 Flute: OFF";

}


function toggleFlute(){

if(fluteOn){
stopFlute();
}else{
startFlute();
}

}


/* FIRST TOUCH STARTS MUSIC */

function firstTouch(){

startFlute();

document.removeEventListener(
"touchstart",
firstTouch
);

document.removeEventListener(
"pointerdown",
firstTouch
);

}


document.addEventListener(
"touchstart",
firstTouch,
{once:true,passive:true}
);

document.addEventListener(
"pointerdown",
firstTouch,
{once:true}
);


/* FLUTE BUTTON */

document.getElementById(
"fluteBtn"
).onclick=function(e){

e.stopPropagation();

toggleFlute();

};


/* =====================================================
   GAME
   ===================================================== */

const games={

focus:[
[
"Find the RED object",
"लाल वस्तु चुनो",
["🔴","Red"],
["🔵","Blue"]
],
[
"Find the STAR",
"तारा चुनो",
["⭐","Star"],
["❤️","Heart"]
],
[
"Find the DOG",
"कुत्ता चुनो",
["🐶","Dog"],
["🐱","Cat"]
]
],

visual:[
[
"Choose RED",
"लाल चुनो",
["🔴","Red"],
["🟢","Green"]
],
[
"Choose BLUE",
"नीला चुनो",
["🔵","Blue"],
["🟡","Yellow"]
],
[
"Choose CIRCLE",
"गोला चुनो",
["⚪","Circle"],
["⬛","Square"]
]
],

communication:[
[
"Choose HELP",
"मदद चुनो",
["🙋","Help"],
["🛑","Stop"]
],
[
"Choose MORE",
"और चुनो",
["➕","More"],
["✅","Finished"]
],
[
"Choose I WANT APPLE",
"मुझे सेब चाहिए चुनो",
["🍎","I want apple"],
["🧸","I want toy"]
]
],

emotion:[
[
"Choose HAPPY",
"खुश चुनो",
["😊","Happy"],
["😢","Sad"]
],
[
"Choose ANGRY",
"गुस्सा चुनो",
["😡","Angry"],
["😌","Calm"]
],
[
"Choose SCARED",
"डरा हुआ चुनो",
["😨","Scared"],
["😊","Happy"]
]
]

};


let language="en";
let currentWorld="";
let questionNo=0;
let answered=false;


function speak(text,hi){

if(!window.speechSynthesis)return;

speechSynthesis.cancel();

const u=
new SpeechSynthesisUtterance(
language==="en"?text:hi
);

u.lang=
language==="en"
?"en-IN"
:"hi-IN";

u.rate=0.8;

speechSynthesis.speak(u);

}


function loadQuestion(){

const q=
games[currentWorld][
questionNo%games[currentWorld].length
];

document.getElementById(
"mission"
).textContent=
"Mission "+(questionNo+1);

document.getElementById(
"question"
).textContent=
language==="en"?q[0]:q[1];

const choices=
document.getElementById("choices");

choices.innerHTML="";


[q[2],q[3]].forEach(
(item,index)=>{

const b=
document.createElement("button");

b.className="choice";

b.innerHTML=
item[0]+
"<span>"+item[1]+"</span>";

b.onclick=function(){

checkAnswer(
b,
index,
item[1]
);

};

choices.appendChild(b);

}
);


document.getElementById(
"feedback"
).textContent="";

document.getElementById(
"nextBtn"
).classList.add("hidden");

document.getElementById(
"retryBtn"
).classList.add("hidden");

answered=false;

}


function startGame(world){

currentWorld=world;

questionNo=0;

document.getElementById(
"game"
).classList.remove("hidden");

startFlute();

loadQuestion();

}


function checkAnswer(button,index,name){

if(answered)return;

answered=true;

if(index===0){

button.classList.add("correct");

document.getElementById(
"feedback"
).textContent=
language==="en"
?"⭐ Great job! You did it!"
:"⭐ बहुत अच्छा! तुमने कर लिया!";

document.getElementById(
"nextBtn"
).classList.remove("hidden");

}else{

button.classList.add("wrong");

document.getElementById(
"feedback"
).textContent=
language==="en"
?"Good try! Try again. You can do it!"
:"अच्छी कोशिश! फिर कोशिश करो। तुम कर सकते हो!";

document.getElementById(
"retryBtn"
).classList.remove("hidden");

}

}


document.querySelectorAll(
".world"
).forEach(
button=>{

button.onclick=function(){

startGame(
button.dataset.world
);

};

}
);


/* NEXT */

document.getElementById(
"nextBtn"
).onclick=function(){

questionNo++;

loadQuestion();

};


/* RETRY */

document.getElementById(
"retryBtn"
).onclick=function(){

loadQuestion();

};


/* SPEAKER */

document.getElementById(
"speakBtn"
).onclick=function(){

const q=
games[currentWorld][
questionNo%games[currentWorld].length
];

speak(q[0],q[1]);

};


/* LANGUAGE */

document.getElementById(
"langBtn"
).onclick=function(){

language=
language==="en"
?"hi"
:"en";

document.getElementById(
"langBtn"
).textContent=
language==="en"
?"हिन्दी"
:"English";

if(currentWorld){
loadQuestion();
}

};


/* RESUME AUDIO */

document.addEventListener(
"visibilitychange",
function(){

if(
!document.hidden &&
fluteOn &&
audioContext
){

audioContext.resume();

}

});

</script>

</body>
</html>
