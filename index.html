<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autsnoboy - Learning Adventure</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#e8f7ff,#fff7e8);
  color: #222;
  text-align: center;
}

header {
  padding: 18px 12px 8px;
}

.logo {
  width: 110px;
  height: 110px;
  object-fit: contain;
}

h1 {
  margin: 5px 0;
  font-size: 30px;
}

.subtitle {
  margin: 5px 0 15px;
  color: #555;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 15px;
}

button {
  border: none;
  border-radius: 14px;
  padding: 12px 18px;
  font-size: 16px;
  cursor: pointer;
  font-weight: bold;
}

.lang-btn {
  background: #ffffff;
  border: 2px solid #ddd;
}

.music-btn {
  background: #fff0b8;
}

.start-btn {
  background: #45b96b;
  color: white;
  font-size: 20px;
  padding: 15px 35px;
}

.game {
  max-width: 850px;
  margin: auto;
  padding: 10px;
}

.card {
  background: white;
  border-radius: 25px;
  padding: 25px;
  box-shadow: 0 8px 30px rgba(0,0,0,.10);
  margin-bottom: 20px;
}

.progress {
  height: 14px;
  background: #eee;
  border-radius: 20px;
  overflow: hidden;
  margin: 15px 0;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #45b96b;
  transition: width .4s;
}

.question {
  font-size: 25px;
  font-weight: bold;
  margin: 20px 0;
}

.hear-btn {
  background: #e9ddff;
}

.options {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(130px,1fr));
  gap: 14px;
  margin-top: 20px;
}

.option {
  min-height: 100px;
  font-size: 22px;
  background: #f4f7ff;
  border: 3px solid transparent;
  transition: .2s;
}

.option:hover {
  transform: scale(1.03);
}

.feedback {
  min-height: 65px;
  margin-top: 20px;
  padding: 15px;
  border-radius: 18px;
  font-size: 21px;
  font-weight: bold;
}

.try-again {
  background: #fff3cd;
  color: #765800;
}

.success {
  background: #dff7e5;
  color: #176b31;
}

.badge {
  display: inline-block;
  background: #fff0a8;
  padding: 10px 15px;
  border-radius: 20px;
  margin: 5px;
  font-weight: bold;
}

.hidden {
  display: none;
}

.next-btn {
  background: #4d8cff;
  color: white;
  margin-top: 15px;
}

.restart-btn {
  background: #777;
  color: white;
  margin-top: 15px;
}

.big-emoji {
  font-size: 70px;
  margin: 15px;
}

.choice {
  font-size: 24px;
}

.small {
  font-size: 14px;
  color: #666;
  margin-top: 12px;
}

@media(max-width:600px) {
  h1 {
    font-size: 25px;
  }

  .question {
    font-size: 21px;
  }

  .option {
    min-height: 85px;
    font-size: 19px;
  }
}
</style>
</head>

<body>

<header>

<img src="autsnoboy.png" class="logo" alt="Autsnoboy">

<h1>Autsnoboy</h1>

<div class="subtitle" id="subtitle">
Learning Adventure
</div>

<div class="controls">

<button class="lang-btn" onclick="setLanguage('en')">
🇬🇧 English
</button>

<button class="lang-btn" onclick="setLanguage('hi')">
🇮🇳 हिन्दी
</button>

<button class="music-btn" onclick="toggleMusic()" id="musicButton">
🎵 Music ON
</button>

</div>

</header>


<div class="game">

<div id="startScreen" class="card">

<div class="big-emoji">🦸‍♂️</div>

<h2 id="welcomeTitle">
Welcome to Autsnoboy's Learning Adventure!
</h2>

<p id="welcomeText">
Let's learn, play and have fun together.
</p>

<button class="start-btn" onclick="startGame()">
▶ START
</button>

<p class="small">
No grades • No failure • Every try counts ❤️
</p>

</div>


<div id="gameScreen" class="hidden">

<div class="card">

<div id="missionTitle">
Mission 1
</div>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<div class="question" id="question">
</div>

<button class="hear-btn" onclick="speakQuestion()">
🔊 <span id="hearText">Hear Question</span>
</button>

<div class="options" id="options">
</div>

<div id="feedback" class="feedback hidden">
</div>

<button id="nextButton" class="next-btn hidden" onclick="nextMission()">
➡️ Next Mission
</button>

</div>

</div>


<div id="finishScreen" class="card hidden">

<div class="big-emoji">🎉🦸‍♂️🎉</div>

<h2 id="finishTitle">
Amazing! You completed the adventure!
</h2>

<p id="finishText">
You kept trying and learning.
</p>

<div id="badges"></div>

<button class="restart-btn" onclick="restartGame()">
🔄 Play Again
</button>

</div>

</div>


<!-- BACKGROUND MUSIC -->
<audio
id="backgroundMusic"
src="bmdkbandara-whispers-of-the-stream-417622.mp3"
loop
preload="auto">
</audio>

<!-- REAL APPLAUSE + AUDIENCE CHEER -->
<audio
id="cheerSound"
src="driken5482-applause-cheer-236786.mp3"
preload="auto">
</audio>


<script>

let language = "en";
let currentMission = 0;
let musicOn = true;
let gameStarted = false;

const music = document.getElementById("backgroundMusic");
const cheer = document.getElementById("cheerSound");


// --------------------------------------------------
// MISSIONS
// --------------------------------------------------

const missions = [

{
title_en:"Mission 1 - Find the Color",
title_hi:"मिशन 1 - रंग पहचानो",

question_en:"Find the RED object.",
question_hi:"लाल रंग की वस्तु चुनो।",

options:[
{en:"🔴 Red",hi:"🔴 लाल",correct:true},
{en:"🔵 Blue",hi:"🔵 नीला",correct:false},
{en:"🟢 Green",hi:"🟢 हरा",correct:false},
{en:"🟡 Yellow",hi:"🟡 पीला",correct:false}
]
},

{
title_en:"Mission 2 - Same Pair",
title_hi:"मिशन 2 - एक जैसी जोड़ी",

question_en:"Which two objects are the same?",
question_hi:"कौन सी दो वस्तुएँ एक जैसी हैं?",

options:[
{en:"🍎 🍎",hi:"🍎 🍎",correct:true},
{en:"🍎 🍌",hi:"🍎 🍌",correct:false},
{en:"🚗 🚌",hi:"🚗 🚌",correct:false},
{en:"🐶 🐱",hi:"🐶 🐱",correct:false}
]
},

{
title_en:"Mission 3 - Complete the Pattern",
title_hi:"मिशन 3 - पैटर्न पूरा करो",

question_en:"What comes next? 🔴 🔵 🔴 🔵 ?",
question_hi:"इसके बाद क्या आएगा? 🔴 🔵 🔴 🔵 ?",

options:[
{en:"🔴 Red",hi:"🔴 लाल",correct:true},
{en:"🟢 Green",hi:"🟢 हरा",correct:false},
{en:"🟡 Yellow",hi:"🟡 पीला",correct:false},
{en:"⚫ Black",hi:"⚫ काला",correct:false}
]
},

{
title_en:"Mission 4 - Feelings",
title_hi:"मिशन 4 - भावनाएँ",

question_en:"Which face looks HAPPY?",
question_hi:"कौन सा चेहरा खुश है?",

options:[
{en:"😊 Happy",hi:"😊 खुश",correct:true},
{en:"😢 Sad",hi:"😢 उदास",correct:false},
{en:"😡 Angry",hi:"😡 गुस्सा",correct:false},
{en:"😨 Scared",hi:"😨 डरा हुआ",correct:false}
]
},

{
title_en:"Mission 5 - Communication",
title_hi:"मिशन 5 - बातचीत",

question_en:"What can you say when you need help?",
question_hi:"जब आपको मदद चाहिए तो आप क्या कह सकते हैं?",

options:[
{en:"🆘 Help me",hi:"🆘 मेरी मदद करो",correct:true},
{en:"😴 Sleep",hi:"😴 सोना",correct:false},
{en:"🍎 Apple",hi:"🍎 सेब",correct:false},
{en:"🏃 Run",hi:"🏃 दौड़ना",correct:false}
]
},

{
title_en:"Mission 6 - Daily Life",
title_hi:"मिशन 6 - रोज़मर्रा की जिंदगी",

question_en:"What should we use to brush our teeth?",
question_hi:"दाँत साफ करने के लिए हमें क्या इस्तेमाल करना चाहिए?",

options:[
{en:"🪥 Toothbrush",hi:"🪥 टूथब्रश",correct:true},
{en:"👟 Shoe",hi:"👟 जूता",correct:false},
{en:"🧸 Toy",hi:"🧸 खिलौना",correct:false},
{en:"☂️ Umbrella",hi:"☂️ छाता",correct:false}
]
},

{
title_en:"Mission 7 - Friendship",
title_hi:"मिशन 7 - दोस्ती",

question_en:"What should we do when it is someone else's turn?",
question_hi:"जब किसी और की बारी हो तो हमें क्या करना चाहिए?",

options:[
{en:"🤝 Wait for my turn",hi:"🤝 अपनी बारी का इंतज़ार करें",correct:true},
{en:"😡 Get angry",hi:"😡 गुस्सा करें",correct:false},
{en:"🏃 Run away",hi:"🏃 भाग जाएँ",correct:false},
{en:"📢 Shout",hi:"📢 चिल्लाएँ",correct:false}
]
}

];


// --------------------------------------------------
// LANGUAGE
// --------------------------------------------------

function setLanguage(lang){

language = lang;

if(gameStarted){
renderMission();
}

document.getElementById("subtitle").innerText =
language === "en"
? "Learning Adventure"
: "सीखने का रोमांच";

document.getElementById("welcomeTitle").innerText =
language === "en"
? "Welcome to Autsnoboy's Learning Adventure!"
: "Autsnoboy के Learning Adventure में आपका स्वागत है!";

document.getElementById("welcomeText").innerText =
language === "en"
? "Let's learn, play and have fun together."
: "आओ साथ में खेलें, सीखें और मज़ा करें।";

}


// --------------------------------------------------
// START GAME
// --------------------------------------------------

function startGame(){

gameStarted = true;

document.getElementById("startScreen").classList.add("hidden");
document.getElementById("gameScreen").classList.remove("hidden");
document.getElementById("finishScreen").classList.add("hidden");

currentMission = 0;

startMusic();

renderMission();

}


// --------------------------------------------------
// MUSIC
// --------------------------------------------------

function startMusic(){

if(!musicOn) return;

music.volume = 0.25;

music.play().then(()=>{

console.log("Music started");

}).catch((error)=>{

console.log("Music waiting for user interaction",error);

});

}


function toggleMusic(){

musicOn = !musicOn;

const btn = document.getElementById("musicButton");

if(musicOn){

btn.innerText =
language === "en"
? "🎵 Music ON"
: "🎵 संगीत ON";

startMusic();

}else{

music.pause();

btn.innerText =
language === "en"
? "🔇 Music OFF"
: "🔇 संगीत OFF";

}

}


// --------------------------------------------------
// REAL APPLAUSE
// --------------------------------------------------

function playCheer(){

cheer.currentTime = 0;

cheer.volume = 1.0;

cheer.play().catch(error=>{

console.log("Cheer could not play:",error);

});

}


// --------------------------------------------------
// RENDER MISSION
// --------------------------------------------------

function renderMission(){

const mission = missions[currentMission];

document.getElementById("missionTitle").innerText =
language === "en"
? mission.title_en
: mission.title_hi;

document.getElementById("question").innerText =
language === "en"
? mission.question_en
: mission.question_hi;

document.getElementById("hearText").innerText =
language === "en"
? "Hear Question"
: "सवाल सुनें";

const progress =
((currentMission) / missions.length) * 100;

document.getElementById("progressBar").style.width =
progress + "%";

const optionsDiv =
document.getElementById("options");

optionsDiv.innerHTML = "";

mission.options.forEach((option,index)=>{

const button =
document.createElement("button");

button.className = "option";

button.innerText =
language === "en"
? option.en
: option.hi;

button.onclick =
()=>checkAnswer(option.correct);

optionsDiv.appendChild(button);

});

document.getElementById("feedback").className =
"feedback hidden";

document.getElementById("feedback").innerText = "";

document.getElementById("nextButton").classList.add("hidden");

}


// --------------------------------------------------
// CHECK ANSWER
// --------------------------------------------------

function checkAnswer(correct){

const feedback =
document.getElementById("feedback");

const nextButton =
document.getElementById("nextButton");


if(correct){

// REAL APPLAUSE
playCheer();

feedback.className =
"feedback success";

feedback.innerText =
language === "en"
? "🎉 Excellent! You did it! Great job!"
: "🎉 बहुत बढ़िया! आपने कर लिया! शाबाश!";

nextButton.classList.remove("hidden");


// Disable options after correct answer

document.querySelectorAll(".option")
.forEach(button=>{
button.disabled = true;
button.style.opacity = "0.7";
});

}else{

// WRONG ANSWER = ENCOURAGEMENT ONLY

feedback.className =
"feedback try-again";

feedback.innerText =
language === "en"
? "💛 That's okay! You can do it. Try again!"
: "💛 कोई बात नहीं! आप कर सकते हो। दोबारा कोशिश करो!";

// NO negative sound
// NO game over
// NO score reduction

setTimeout(()=>{

feedback.className =
"feedback try-again";

},100);

}

}


// --------------------------------------------------
// NEXT MISSION
// --------------------------------------------------

function nextMission(){

currentMission++;

if(currentMission >= missions.length){

finishGame();

return;

}

renderMission();

}


// --------------------------------------------------
// FINISH
// --------------------------------------------------

function finishGame(){

document.getElementById("gameScreen")
.classList.add("hidden");

document.getElementById("finishScreen")
.classList.remove("hidden");

document.getElementById("progressBar")
.style.width = "100%";

if(language === "en"){

document.getElementById("finishTitle").innerText =
"🎉 Amazing! You completed the adventure!";

document.getElementById("finishText").innerText =
"You kept trying, learning and growing! ❤️";

}else{

document.getElementById("finishTitle").innerText =
"🎉 बहुत बढ़िया! आपने पूरा Adventure पूरा कर लिया!";

document.getElementById("finishText").innerText =
"आपने कोशिश की, सीखा और आगे बढ़े! ❤️";

}


const badges =
document.getElementById("badges");

badges.innerHTML = `

<div class="badge">🌟 Focus Explorer</div>

<div class="badge">👀 Sharp Eyes</div>

<div class="badge">🗣️ Communicator</div>

<div class="badge">😊 Feelings Explorer</div>

<div class="badge">🤝 Friendship Hero</div>

<div class="badge">💪 Try-Again Champion</div>

`;

}


// --------------------------------------------------
// RESTART
// --------------------------------------------------

function restartGame(){

currentMission = 0;

document.getElementById("finishScreen")
.classList.add("hidden");

document.getElementById("gameScreen")
.classList.remove("hidden");

renderMission();

startMusic();

}


// --------------------------------------------------
// QUESTION VOICE
// --------------------------------------------------

function speakQuestion(){

if(!("speechSynthesis" in window)){

alert(
language === "en"
? "Voice is not supported on this device."
: "इस डिवाइस में Voice सुविधा उपलब्ध नहीं है।"
);

return;

}

window.speechSynthesis.cancel();

const mission =
missions[currentMission];

const text =
language === "en"
? mission.question_en
: mission.question_hi;

const utterance =
new SpeechSynthesisUtterance(text);

if(language === "hi"){

utterance.lang = "hi-IN";

}else{

utterance.lang = "en-IN";

}

utterance.rate = 0.85;

utterance.pitch = 1.05;

utterance.volume = 1;

window.speechSynthesis.speak(utterance);

}


// --------------------------------------------------
// FIRST USER INTERACTION
// --------------------------------------------------

document.addEventListener("click",function(){

if(gameStarted && musicOn){

if(music.paused){

music.play().catch(()=>{});

}

}

},{once:false});

</script>

</body>
</html>
