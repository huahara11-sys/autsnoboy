<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6d5dfc">

<title>Autsnoboy - Learning Adventure</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#eef7ff,#f8f1ff);
color:#243047;
}

.app{
max-width:760px;
margin:auto;
padding:18px;
}

header{
background:linear-gradient(135deg,#6355e8,#8175ff);
color:white;
border-radius:25px;
padding:25px 20px;
text-align:center;
box-shadow:0 8px 25px rgba(60,50,150,.2);
}

.logo{
font-size:65px;
}

h1{
margin:5px 0;
font-size:34px;
}

.sub{
font-size:17px;
opacity:.95;
}

.owner{
margin-top:8px;
font-size:14px;
opacity:.9;
}

.controls{
display:flex;
gap:10px;
justify-content:center;
flex-wrap:wrap;
margin-top:18px;
}

.btn{
border:0;
border-radius:15px;
padding:13px 18px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.language{
background:#222;
color:white;
}

.music{
background:#19a05b;
color:white;
}

.voice{
background:#ff8a00;
color:white;
}

.start{
background:#6d5dfc;
color:white;
font-size:20px;
padding:16px 30px;
}

.card{
background:white;
border-radius:24px;
padding:22px;
margin-top:18px;
box-shadow:0 6px 25px rgba(40,50,90,.09);
}

.progress{
height:11px;
background:#ececf4;
border-radius:20px;
overflow:hidden;
}

.bar{
height:100%;
width:0;
background:#6d5dfc;
transition:width .4s;
}

.small{
font-size:13px;
color:#70798b;
margin-top:8px;
}

.mission{
text-align:center;
}

.mission h2{
font-size:27px;
}

.instruction{
font-size:19px;
line-height:1.5;
}

.choices{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:13px;
margin-top:20px;
}

.choice{
min-height:105px;
border:2px solid #e4e6ef;
border-radius:18px;
background:#fafbff;
font-size:23px;
font-weight:bold;
cursor:pointer;
padding:12px;
}

.choice:active{
transform:scale(.97);
}

.choice:disabled{
opacity:.75;
cursor:default;
}

.message{
text-align:center;
min-height:42px;
margin:18px 0 5px;
font-size:20px;
font-weight:bold;
}

.celebrate{
text-align:center;
font-size:45px;
min-height:55px;
}

.action{
text-align:center;
margin-top:10px;
}

.next{
background:#6d5dfc;
color:white;
}

.restart{
background:#ef5d78;
color:white;
margin-left:8px;
}

.badges{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:12px;
}

.badge{
background:#f2edff;
padding:9px 12px;
border-radius:13px;
font-size:14px;
}

.startScreen{
text-align:center;
padding:25px 10px;
}

.startScreen p{
font-size:18px;
line-height:1.5;
color:#606a7b;
}

.hidden{
display:none;
}

@media(max-width:430px){

.choices{
grid-template-columns:1fr 1fr;
}

.choice{
min-height:90px;
font-size:19px;
}

}

</style>
</head>


<body>

<div class="app">


<!-- HEADER -->

<header>

<div class="logo">🦸</div>

<h1>Autsnoboy</h1>

<div class="sub">
Learning Adventure
</div>

<div class="owner">
Owned & Developed by Varun Mamta
</div>


<div class="controls">

<button
class="btn language"
id="langBtn">

🇬🇧 English / 🇮🇳 हिन्दी

</button>


<button
class="btn music"
id="musicBtn">

🎵 Music ON

</button>


<button
class="btn voice"
id="voiceBtn">

🔊 Hear Question

</button>

</div>

</header>



<!-- START SCREEN -->

<div
class="card startScreen"
id="startScreen">

<h2>
🌟 Welcome to Autsnoboy!
</h2>

<p id="welcomeText">

Let's learn, play and have fun together!

</p>

<button
class="btn start"
id="startBtn">

🚀 START ADVENTURE

</button>

</div>



<!-- GAME -->

<div
id="gameArea"
class="hidden">


<!-- PROGRESS -->

<div class="card">

<div class="progress">

<div
class="bar"
id="bar">
</div>

</div>

<div
class="small"
id="missionCount">

Mission 1 of 7

</div>

</div>



<!-- MISSION -->

<div class="card mission">

<h2 id="title">
🔴 Find RED
</h2>

<p
class="instruction"
id="instruction">

Which one is RED?

</p>


<div
class="choices"
id="choices">
</div>


<div
class="message"
id="message">
</div>


<div
class="celebrate"
id="celebration">
</div>


<div class="action">

<button
class="btn next"
id="nextBtn"
style="display:none">

Next Mission ➜

</button>


<button
class="btn restart"
id="restartBtn">

↻ Restart

</button>

</div>

</div>



<!-- REWARD -->

<div class="card">

<strong id="rewardTitle">

Every Step Counts 🌱

</strong>

<p
id="rewardText"
class="small">

Try again, use a hint, or do it yourself — every step is progress.

</p>


<div
id="badges"
class="badges">
</div>

</div>

</div>


<!-- BACKGROUND FLUTE -->

<audio
id="backgroundMusic"
src="./calming-flute.mp3"
loop
preload="auto">
</audio>


<!-- REAL AUDIENCE CHEER -->

<audio
id="cheerSound"
src="./driken5482-applause-cheer-236786.mp3"
preload="auto">
</audio>


</div>



<script>

/* =====================================
   MISSIONS
===================================== */

const missions=[

{
enTitle:"🔴 Find RED",
hiTitle:"🔴 लाल ढूँढो",

enQuestion:"Which one is RED?",
hiQuestion:"लाल कौन सा है?",

enChoices:[
"🔵 Blue",
"🔴 Red",
"🟢 Green",
"🟡 Yellow"
],

hiChoices:[
"🔵 नीला",
"🔴 लाल",
"🟢 हरा",
"🟡 पीला"
],

answer:1,
badge:"Sharp Eyes 👀"
},


{
enTitle:"👯 Find SAME",
hiTitle:"👯 समान ढूँढो",

enQuestion:"Which pair is the SAME?",
hiQuestion:"कौन सी जोड़ी समान है?",

enChoices:[
"🐶 🐱",
"🍎 🍎",
"🚗 🚌",
"⭐ ❤️"
],

hiChoices:[
"🐶 🐱",
"🍎 🍎",
"🚗 🚌",
"⭐ ❤️"
],

answer:1,
badge:"Visual Explorer 🌟"
},


{
enTitle:"🧩 Complete Pattern",
hiTitle:"🧩 पैटर्न पूरा करो",

enQuestion:"What comes next?",
hiQuestion:"अगला क्या आएगा?",

enChoices:[
"🔴",
"🔵",
"🔴",
"🟢"
],

hiChoices:[
"🔴",
"🔵",
"🔴",
"🟢"
],

answer:2,
badge:"Pattern Star 🧩"
},


{
enTitle:"😊 Find HAPPY",
hiTitle:"😊 खुश चेहरा ढूँढो",

enQuestion:"Which face is HAPPY?",
hiQuestion:"कौन सा चेहरा खुश है?",

enChoices:[
"😢 Sad",
"😡 Angry",
"😊 Happy",
"😨 Scared"
],

hiChoices:[
"😢 उदास",
"😡 गुस्सा",
"😊 खुश",
"😨 डरा हुआ"
],

answer:2,
badge:"Feelings Explorer 😊"
},


{
enTitle:"🗣️ Ask for HELP",
hiTitle:"🗣️ मदद माँगो",

enQuestion:"What can you say?",
hiQuestion:"आप क्या कह सकते हैं?",

enChoices:[
"🙏 Help me",
"🚫 Go away",
"😴 Sleep",
"🍎 Apple"
],

hiChoices:[
"🙏 मेरी मदद करो",
"🚫 चले जाओ",
"😴 सोना",
"🍎 सेब"
],

answer:0,
badge:"Little Communicator 🗣️"
},


{
enTitle:"🎵 Rhythm Choice",
hiTitle:"🎵 संगीत चुनो",

enQuestion:"Which sound is musical?",
hiQuestion:"कौन सा संगीत है?",

enChoices:[
"🎶 Music",
"🚗 Car",
"🍎 Apple",
"🧱 Block"
],

hiChoices:[
"🎶 संगीत",
"🚗 कार",
"🍎 सेब",
"🧱 ब्लॉक"
],

answer:0,
badge:"Rhythm Star 🎵"
},


{
enTitle:"🧼 Daily Life",
hiTitle:"🧼 रोज़ की ज़िंदगी",

enQuestion:"What should we do before eating?",
hiQuestion:"खाने से पहले क्या करना चाहिए?",

enChoices:[
"🧼 Wash hands",
"🛌 Sleep",
"📺 TV",
"👟 Shoes"
],

hiChoices:[
"🧼 हाथ धोना",
"🛌 सोना",
"📺 टीवी",
"👟 जूते"
],

answer:0,
badge:"Daily Hero 🧼"
}

];



/* =====================================
   VARIABLES
===================================== */

let lang="en";

let currentMission=0;

let earned=[];

let gameStarted=false;

let musicPlaying=false;



/* =====================================
   AUDIO ELEMENTS
===================================== */

const backgroundMusic=
document.getElementById("backgroundMusic");

const cheerSound=
document.getElementById("cheerSound");


backgroundMusic.volume=0.18;

cheerSound.volume=1.0;



/* =====================================
   START MUSIC
===================================== */

function startMusic(){

backgroundMusic.volume=0.18;

backgroundMusic.play()
.then(function(){

musicPlaying=true;

document.getElementById("musicBtn")
.textContent="🎵 Music ON";

})
.catch(function(error){

console.log(
"Music waiting for user:",
error
);

});

}



/* =====================================
   STOP MUSIC
===================================== */

function stopMusic(){

backgroundMusic.pause();

musicPlaying=false;

document.getElementById("musicBtn")
.textContent="🔇 Music OFF";

}



/* =====================================
   REAL AUDIENCE CHEER
===================================== */

function playCheer(){

cheerSound.pause();

cheerSound.currentTime=0;

cheerSound.volume=1.0;

cheerSound.play()
.catch(function(error){

console.log(
"Audience cheer error:",
error
);

});

}



/* =====================================
   QUESTION VOICE
===================================== */

function speakQuestion(){

if(!gameStarted){

return;

}


/* Stop previous voice */

window.speechSynthesis.cancel();


const m=missions[currentMission];

let text="";

let language="en-IN";


if(lang==="en"){

text=
m.enTitle
+
". "
+
m.enQuestion;

language="en-IN";

}

else{

text=
m.hiTitle
+
". "
+
m.hiQuestion;

language="hi-IN";

}


const speech=
new SpeechSynthesisUtterance(text);


speech.lang=language;

speech.rate=0.82;

speech.pitch=1.05;

speech.volume=1.0;


/* Try to select matching voice */

const voices=
window.speechSynthesis.getVoices();


let selectedVoice=
voices.find(
function(v){

return v.lang
.toLowerCase()
.startsWith(
language.toLowerCase()
);

}
);


if(selectedVoice){

speech.voice=selectedVoice;

}


window.speechSynthesis.speak(
speech
);

}



/* =====================================
   VOICE BUTTON
===================================== */

document.getElementById("voiceBtn")
.addEventListener(
"click",
function(){

speakQuestion();

}
);



/* =====================================
   MUSIC BUTTON
===================================== */

document.getElementById("musicBtn")
.addEventListener(
"click",
function(){

if(musicPlaying){

stopMusic();

}

else{

startMusic();

}

}
);



/* =====================================
   START BUTTON
===================================== */

document.getElementById("startBtn")
.addEventListener(
"click",
function(){

gameStarted=true;

document.getElementById(
"startScreen"
).classList.add("hidden");


document.getElementById(
"gameArea"
).classList.remove("hidden");


/* Start flute after user tap */

startMusic();


/* Show first question */

render();


/* Speak first question */

setTimeout(
function(){

speakQuestion();

},
500
);

}
);



/* =====================================
   RENDER MISSION
===================================== */

function render(){

const m=
missions[currentMission];


document.getElementById(
"title"
).textContent=
lang==="en"
?
m.enTitle
:
m.hiTitle;


document.getElementById(
"instruction"
).textContent=
lang==="en"
?
m.enQuestion
:
m.hiQuestion;


document.getElementById(
"missionCount"
).textContent=

lang==="en"
?
"Mission "
+
(currentMission+1)
+
" of "
+
missions.length
:
"मिशन "
+
(currentMission+1)
+
" में से "
+
missions.length;


document.getElementById(
"bar"
).style.width=
(
currentMission/
missions.length
*100
)
+
"%";


document.getElementById(
"message"
).textContent="";


document.getElementById(
"celebration"
).textContent="";


document.getElementById(
"nextBtn"
).style.display="none";


const choicesBox=
document.getElementById(
"choices"
);

choicesBox.innerHTML="";


const choices=
lang==="en"
?
m.enChoices
:
m.hiChoices;


choices.forEach(
function(choice,i){

const button=
document.createElement(
"button"
);

button.className="choice";

button.textContent=choice;

button.type="button";


button.addEventListener(
"click",
function(){

checkAnswer(i);

}
);


choicesBox.appendChild(
button
);

}

);

}



/* =====================================
   ANSWER
===================================== */

function checkAnswer(selected){

const m=
missions[currentMission];


const message=
document.getElementById(
"message"
);


const celebration=
document.getElementById(
"celebration"
);


/* =========================
   CORRECT
========================= */

if(selected===m.answer){


message.textContent=

lang==="en"
?
"⭐ Great job!"
:
"⭐ बहुत अच्छा!";


celebration.textContent=
"👏 🎉 👏";


/* REAL AUDIENCE */

playCheer();


/* BADGE */

if(
!earned.includes(m.badge)
){

earned.push(m.badge);

drawBadges();

}


/* Disable choices */

document
.querySelectorAll(".choice")
.forEach(
function(button){

button.disabled=true;

}
);


/* Next */

document.getElementById(
"nextBtn"
).style.display=
"inline-block";

}


/* =========================
   WRONG
========================= */

else{


message.textContent=

lang==="en"
?
"💛 Try again. You can do it!"
:
"💛 फिर कोशिश करो। तुम कर सकते हो!";


celebration.textContent=
"💪";


/* No cheer on wrong answer */

}

}



/* =====================================
   NEXT MISSION
===================================== */

document.getElementById(
"nextBtn"
).addEventListener(
"click",
function(){


if(
currentMission<
missions.length-1
){

currentMission++;


render();


/* Speak next question */

setTimeout(
function(){

speakQuestion();

},
400
);

}

else{


/* COMPLETE */

document.getElementById(
"title"
).textContent=

lang==="en"
?
"🎉 Adventure Complete!"
:
"🎉 एडवेंचर पूरा!";


document.getElementById(
"instruction"
).textContent=

lang==="en"
?
"You kept trying — every step counts!"
:
"आपने कोशिश जारी रखी — हर कदम महत्वपूर्ण है!";


document.getElementById(
"choices"
).innerHTML="";


document.getElementById(
"message"
).textContent=

lang==="en"
?
"🏆 Amazing! You completed the adventure!"
:
"🏆 शानदार! आपने एडवेंचर पूरा कर लिया!";


document.getElementById(
"celebration"
).textContent=
"🦸 👏 🎉 👏 🏆";


document.getElementById(
"nextBtn"
).style.display=
"none";


document.getElementById(
"bar"
).style.width=
"100%";


/* Final applause */

playCheer();

}

}
);



/* =====================================
   RESTART
===================================== */

document.getElementById(
"restartBtn"
).addEventListener(
"click",
function(){

window.speechSynthesis.cancel();

currentMission=0;

earned=[];

drawBadges();

render();


setTimeout(
function(){

speakQuestion();

},
400
);

}
);



/* =====================================
   LANGUAGE
===================================== */

document.getElementById(
"langBtn"
).addEventListener(
"click",
function(){

lang=
lang==="en"
?
"hi"
:
"en";


document.getElementById(
"welcomeText"
).textContent=

lang==="en"
?
"Let's learn, play and have fun together!"
:
"आइए साथ मिलकर सीखें, खेलें और मज़ा करें!";


document.getElementById(
"rewardTitle"
).textContent=

lang==="en"
?
"Every Step Counts 🌱"
:
"हर कदम महत्वपूर्ण है 🌱";


document.getElementById(
"rewardText"
).textContent=

lang==="en"
?
"Try again, use a hint, or do it yourself — every step is progress."
:
"फिर कोशिश करना, मदद लेना या खुद करना — हर कदम प्रगति है।";


render();


/* Speak current question in new language */

if(gameStarted){

setTimeout(
function(){

speakQuestion();

},
300
);

}

}
);



/* =====================================
   BADGES
===================================== */

function drawBadges(){

document.getElementById(
"badges"
).innerHTML=

earned
.map(
function(badge){

return `
<span class="badge">
${badge}
</span>
`;

}
)
.join("");

}



/* =====================================
   LOAD VOICES
===================================== */

window.speechSynthesis.onvoiceschanged=
function(){

window.speechSynthesis.getVoices();

};



/* =====================================
   INITIAL
===================================== */

drawBadges();

</script>

</body>
</html>
