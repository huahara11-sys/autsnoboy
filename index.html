<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autsnoboy Voice Test</title>
</head>

<body style="text-align:center;padding:40px;font-family:Arial">

<h2>🦸 Autsnoboy Voice Test</h2>

<button onclick="sayEnglish()"
style="font-size:20px;padding:15px;margin:10px;">
🇬🇧 WELL DONE
</button>

<br>

<button onclick="sayHindi()"
style="font-size:20px;padding:15px;margin:10px;">
🇮🇳 शाबाश
</button>

<br>

<button onclick="sayTryAgain()"
style="font-size:20px;padding:15px;margin:10px;">
🔄 TRY AGAIN
</button>

<script>

function speak(text, lang){

    window.speechSynthesis.cancel();

    let voice = new SpeechSynthesisUtterance(text);

    voice.lang = lang;
    voice.rate = 0.85;
    voice.pitch = 1;
    voice.volume = 1;

    window.speechSynthesis.speak(voice);
}

function sayEnglish(){
    speak("Well done!", "en-IN");
}

function sayHindi(){
    speak("शाबाश!", "hi-IN");
}

function sayTryAgain(){
    speak("Try again. You can do it!", "en-IN");
}

</script>

</body>
</html>
