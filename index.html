<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autsnoboy - Learning Adventure</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#dff6ff,#fff4d6);
  color:#222;
  text-align:center;
}

.header{
  background:linear-gradient(135deg,#5b4bdb,#7b61ff);
  color:white;
  padding:18px 12px;
  border-radius:0 0 25px 25px;
}

.logo{
  width:90px;
  height:90px;
  object-fit:contain;
  border-radius:50%;
  background:white;
  padding:5px;
}

h1{
  margin:8px 0 3px;
  font-size:30px;
}

.subtitle{
  font-size:15px;
  opacity:.95;
}

.controls{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin:15px auto;
  padding:0 10px;
}

button{
  border:none;
  border-radius:14px;
  padding:12px 18px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  background:white;
  box-shadow:0 4px 10px rgba(0,0,0,.12);
}

button:active{
  transform:scale(.96);
}

.main{
  max-width:700px;
  margin:auto;
  padding:10px;
}

.progressBox{
  background:white;
  border-radius:18px;
  padding:12px;
  margin:10px 0;
  box-shadow:0 4px 12px rgba(0,0,0,.1);
}

.progressBar{
  width:100%;
  height:15px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
  margin-top:8px;
}

.progressFill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00c853,#64dd17);
  transition:.4s;
}

.card{
  background:white;
  border-radius:25px;
  padding:25px 18px;
  margin-top:15px;
  box-shadow:0 7px 20px rgba(0,0,0,.12);
}

.mission{
  color:#6a5acd;
  font-weight:bold;
  font-size:17px;
}

.question{
  font-size:25px;
  font-weight:bold;
  margin:15px 0;
}

.questionHindi{
  font-size:21px;
  color:#555;
  margin-bottom:18px;
}

.options{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  max-width:500px;
  margin:auto;
}

.option{
  min-height:80px;
  font-size:24px;
  background:#f7f7ff;
  border:3px solid transparent;
}

.option:hover{
  border-color:#7b61ff;
}

.feedback{
  min-height:65px;
  margin-top:20px;
  font-size:20px;
  font-weight:bold;
}

.success{
  color:#008a3e;
}

.try{
  color:#e07b00;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  margin-top:15px;
}

.badge{
  background:#fff8cc;
  border-radius:15px;
  padding:9px 12px;
  font-size:14px;
  font-weight:bold;
}

.nextBtn{
  background:#5b4bdb;
  color:white;
  margin-top:12px;
  display:none;
}

.restart{
  background:#ff8a00;
  color:white;
  margin-top:15px;
}

.footer{
  padding:20px;
  font-size:13px;
  color:#666;
}

.hidden{
  display:none;
}

.bigEmoji{
  font-size:60px;
  margin:10px;
}

@media(max-width:500px){
  h1{font-size:25px;}
  .question{font-size:21px;}
  .questionHindi{font-size:18px;}
  .options{grid-template-columns:1fr 1fr;}
  button{font-size:14px;padding:10px 13px;}
}
</style>
</head>

<body>

<div class="header">

<img class="logo"
src="autsnoboy.png"
alt="Autsnoboy">

<h1>🦸 Autsnoboy</h1>

<div class="subtitle">
Learning Adventure • Every Step Counts
</div>

</div>

<div class="controls">

<button onclick="setLanguage('en')">🇬🇧 English</button>

<button onclick="setLanguage('hi')">🇮🇳 हिंदी</button>

<button onclick="toggleMusic()" id="musicBtn">
🎵 Music ON
</button>

<button onclick="hearQuestion()">
🔊 Hear Question
</button>

</div>

<div class="main">

<div class="progressBox">

<div id="progressText">
Mission 1 of 7
</div>

<div class="progressBar">
<div class="progressFill" id="progressFill"></div>
</div>

</div>

<div class="card">

<div class="mission" id="missionTitle">
Mission 1
</div>

<div class="bigEmoji" id="emoji">
🔴
</div>

<div class="question" id="question">
Find the RED object
</div>

<div class="questionHindi" id="questionHindi">
लाल वस्तु खोजो
</div>

<div class="options" id="options"></div>

<div class="feedback" id="feedback"></div>

<button class="nextBtn" id="nextBtn" onclick="nextMission()">
Next Mission ➜
</button>

</div>

<div class="badges" id="badges"></div>

<button class="restart" onclick="restartGame()">
🔄 Restart Adventure
</button>

</div>

<div class="footer">
Autsnoboy is an educational learning game.<br>
Made with ❤️ by Varun Mamta
</div>

<!-- BACKGROUND MUSIC -->

<audio
id="music"
src="bmdkbandara-whispers-of-the-stream-417622.mp3"
loop
preload="auto">
</audio>

<!-- REAL AUDIENCE APPLAUSE -->

<audio
id="cheerSound"
src="driken5482-applause-cheer-236786.mp3"
preload="auto">
</audio>

<script>

let language="en";

let currentMission=0;

let completed=false;

let musicPlaying=false;

const music=document.getElementById("music");

const cheerSound=document.getElementById("cheerSound");

const missions=[

{
 emoji:"🔴",
 titleEn:"Focus Mission",
 titleHi:"ध्यान मिशन",
 questionEn:"Find the RED object",
 questionHi:"लाल वस्तु खोजो",
 options:[
  {text:"🔴",correct:true},
  {text:"🔵",correct:false},
  {text:"🟢",correct:false},
  {text:"🟡",correct:false}
 ]
},

{
 emoji:"👀",
 titleEn:"Visual Mission",
 titleHi:"देखने का मिशन",
 questionEn:"Find the two SAME objects",
 questionHi:"दो एक जैसे चित्र खोजो",
 options:[
  {text:"🍎 🍎",correct:true},
  {text:"🍎 🍌",correct:false},
  {text:"🚗 🚌",correct:false},
  {text:"🐱 🐶",correct:false}
 ]
},

{
 emoji:"🔺",
 titleEn:"Pattern Mission",
 titleHi:"पैटर्न मिशन",
 questionEn:"What comes next?",
 questionHi:"इसके बाद क्या आएगा?",
 options:[
  {text:"🔺",correct:true},
  {text:"🟢",correct:false},
  {text:"⭐",correct:false},
  {text:"❤️",correct:false}
 ]
},

{
 emoji:"😊",
 titleEn:"Emotion Mission",
 titleHi:"भावना मिशन",
 questionEn:"Which face is HAPPY?",
 questionHi:"खुश चेहरा कौन सा है?",
 options:[
  {text:"😊",correct:true},
  {text:"😢",correct:false},
  {text:"😡",correct:false},
  {text:"😴",correct:false}
 ]
},

{
 emoji:"🗣️",
 titleEn:"Communication Mission",
 titleHi:"बोलने का मिशन",
 questionEn:"What can you say when you need help?",
 questionHi:"मदद चाहिए तो क्या कह सकते हो?",
 options:[
  {text:"HELP",correct:true},
  {text:"BYE",correct:false},
  {text:"SLEEP",correct:false},
  {text:"STOP",correct:false}
 ]
},

{
 emoji:"🧼",
 titleEn:"Daily Life Mission",
 titleHi:"दैनिक जीवन मिशन",
 questionEn:"What do we use to wash our hands?",
 questionHi:"हाथ धोने के लिए क्या इस्तेमाल करते हैं?",
 options:[
  {text:"🧼 SOAP",correct:true},
  {text:"📕 BOOK",correct:false},
  {text:"👟 SHOE",correct:false},
  {text:"🧸 TOY",correct:false}
 ]
},

{
 emoji:"🤝",
 titleEn:"Friendship Mission",
 titleHi:"दोस्ती मिशन",
 questionEn:"What should we do when it is someone else's turn?",
 questionHi:"जब किसी और की बारी हो तो क्या करना चाहिए?",
 options:[
  {text:"WAIT",correct:true},
  {text:"RUN",correct:false},
  {text:"SHOUT",correct:false},
  {text:"PUSH",correct:false}
 ]
}

];

function renderMission(){

let m=missions[currentMission];

document.getElementById("missionTitle").textContent=
language==="en"
?m.titleEn
:m.titleHi;

document.getElementById("emoji").textContent=m.emoji;

document.getElementById("question").textContent=m.questionEn;

document.getElementById("questionHindi").textContent=m.questionHi;

document.getElementById("progressText").textContent=
"Mission "+(currentMission+1)+" of "+missions.length;

document.getElementById("progressFill").style.width=
((currentMission)/missions.length*100)+"%";

let options=document.getElementById("options");

options.innerHTML="";

document.getElementById("feedback").innerHTML="";

document.getElementById("nextBtn").style.display="none";

completed=false;

m.options.forEach((option,index)=>{

let btn=document.createElement("button");

btn.className="option";

btn.textContent=option.text;

btn.onclick=function(){

checkAnswer(option.correct);

};

options.appendChild(btn);

});

}

function checkAnswer(correct){

if(completed)return;

let feedback=document.getElementById("feedback");

if(correct){

completed=true;

feedback.className="feedback success";

feedback.innerHTML=
"🎉 "+

(language==="en"
?"Amazing! You did it! 👏"
:"बहुत बढ़िया! आपने कर दिखाया! 👏");

playCheer();

document.querySelectorAll(".option").forEach(b=>{
b.disabled=true;
});

document.getElementById("nextBtn").style.display="inline-block";

addBadge();

}

else{

feedback.className="feedback try";

feedback.innerHTML=
"💪 "+

(language==="en"
?"You can do it! Try again! 🌟"
:"आप कर सकते हो! फिर से कोशिश करो! 🌟");

speakWrong();

}

}

function playCheer(){

cheerSound.currentTime=0;

let p=cheerSound.play();

if(p!==undefined){

p.catch(function(){

console.log("Audio waiting for user interaction");

});

}

}

function speakWrong(){

let text=

language==="en"
?"You can do it. Try again!"
:"आप कर सकते हो। फिर से कोशिश करो!";

speak(text);

}

function hearQuestion(){

let m=missions[currentMission];

let text=

language==="en"
?m.questionEn
:m.questionHi;

speak(text);

}

function speak(text){

if(!("speechSynthesis" in window)){

alert("Voice is not supported on this device.");

return;

}

window.speechSynthesis.cancel();

let utterance=
new SpeechSynthesisUtterance(text);

utterance.lang=
language==="en"
?"en-IN"
:"hi-IN";

utterance.rate=.85;

utterance.pitch=1;

window.speechSynthesis.speak(utterance);

}

function addBadge(){

let badge=document.createElement("div");

badge.className="badge";

let badges=[

"🎯 Focus Explorer",

"👀 Sharp Eyes",

"🔺 Pattern Star",

"😊 Feelings Explorer",

"🗣️ Communication Star",

"🧼 Daily Hero",

"🤝 Friendship Star"

];

badge.textContent=badges[currentMission];

document.getElementById("badges").appendChild(badge);

}

function nextMission(){

if(currentMission<missions.length-1){

currentMission++;

renderMission();

setTimeout(function(){

hearQuestion();

},500);

}

else{

document.getElementById("progressFill").style.width="100%";

document.getElementById("question").textContent=
language==="en"
?"🏆 Adventure Complete!"
:"🏆 एडवेंचर पूरा हुआ!";

document.getElementById("questionHindi").textContent=
language==="en"
?"You tried, learned and grew!"
:"आपने कोशिश की, सीखा और आगे बढ़े!";

document.getElementById("emoji").textContent="🌟";

document.getElementById("options").innerHTML="";

document.getElementById("feedback").className="feedback success";

document.getElementById("feedback").innerHTML=
language==="en"
?"🎉 Fantastic! Every Step Counts! 👏"
:"🎉 शानदार! हर कदम महत्वपूर्ण है! 👏";

playCheer();

document.getElementById("nextBtn").style.display="none";

}

}

function setLanguage(lang){

language=lang;

renderMission();

}

function toggleMusic(){

if(musicPlaying){

music.pause();

musicPlaying=false;

document.getElementById("musicBtn").textContent=
"🎵 Music ON";

}

else{

music.volume=.25;

let p=music.play();

if(p!==undefined){

p.then(function(){

musicPlaying=true;

document.getElementById("musicBtn").textContent=
"🔇 Music OFF";

}).catch(function(){

alert("Please tap the Music button again to start music.");

});

}

}

}

function restartGame(){

currentMission=0;

document.getElementById("badges").innerHTML="";

renderMission();

}

renderMission();

</script>

</body>
</html>
