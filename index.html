<title>Autsnoboy - Learning Adventure</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(135deg,#eef4ff,#fff8e7);
color:#222;
text-align:center;

.header{
background:linear-gradient(135deg,#6257e8,#8b7cff);
color:white;
padding:18px 12px;
border-radius:0 0 25px 25px;
}

.logo{
width:110px;
height:110px;
object-fit:contain;
border-radius:25px;
background:white;
padding:5px;
}

h1{
margin:8px 0 4px;
font-size:32px;
}

.owner{
font-size:14px;
opacity:.9;
}

.container{
max-width:700px;
margin:auto;
padding:18px;
}

.controls{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-bottom:15px;
}

button{
border:none;
border-radius:15px;
padding:13px 18px;
font-size:16px;
font-weight:bold;
cursor:pointer;
background:#6257e8;
color:white;
box-shadow:0 4px 10px rgba(0,0,0,.12);
}

button:active{
transform:scale(.96);
}

.lang{background:#222}
.music{background:#159957}

.card{
background:white;
border-radius:25px;
padding:25px 18px;
margin-top:15px;
box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.mission-title{
font-size:25px;
font-weight:bold;
margin-bottom:10px;
}

.instruction{
font-size:20px;
margin-bottom:18px;
line-height:1.4;
}

.choices{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
}

.choice{
min-height:100px;
font-size:23px;
background:#f5f5ff;
color:#222;
border:3px solid transparent;
}

.choice:hover{
border-color:#6257e8;
}

.feedback{
min-height:45px;
margin-top:18px;
font-size:21px;
font-weight:bold;
}

.progress{
margin-top:15px;
font-size:15px;
color:#666;
}

.badges{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:8px;
margin-top:18px;
}

.badge{
background:#fff4c4;
border-radius:20px;
padding:8px 12px;
font-size:14px;
}

.next{
background:#159957;
margin-top:10px;
display:none;
}

.restart{
background:#e85d75;
margin-top:10px;
}

.footer{
padding:25px;
color:#777;
font-size:13px;
}

@media(max-width:500px){
h1{font-size:27px}
.instruction{font-size:18px}
.choice{font-size:20px;min-height:90px}
button{font-size:15px}
}
</style>

</head>

<body>

<div class="header">

<img src="autsnoboy.png" class="logo" alt="Autsnoboy">

<h1>🦸 Autsnoboy</h1>

<div class="owner">
Learning Adventure • Owned & Developed by Varun Mamta
</div>

</div>

<div class="container">

<div class="controls">

<button class="lang" onclick="toggleLanguage()">
🇬🇧 English / 🇮🇳 हिंदी
</button>

<button class="music" onclick="toggleMusic()" id="musicBtn">
🎵 Music ON
</button>

</div>

<div class="card">

<div class="mission-title" id="missionTitle"></div>

<div class="instruction" id="instruction"></div>

<div class="choices" id="choices"></div>

<div class="feedback" id="feedback"></div>

<div class="progress" id="progress"></div>

<button class="next" id="nextBtn" onclick="nextMission()">
➡️ Next Mission
</button>

<button class="restart" onclick="restartGame()">
🔄 Start Again
</button>

</div>

<div class="badges" id="badges"></div>

</div>

<div class="footer">
A fun learning experience for children 🌟
</div>

/* =========================

========================= */

function playCheer(){

const sound=document.getElementById("cheerSound");

if(!sound){
console.log("Cheer audio element not found");
return;
}

sound.pause();
sound.currentTime=0;
sound.volume=1.0;

let p=sound.play();

if(p!==undefined){

p.then(function(){

console.log("👏 Audience applause playing");

}).catch(function(error){

console.log("Cheer audio blocked:",error);

});

}

}


/* =========================
VOICE
========================= */

function speak(text,language){

if(!("speechSynthesis" in window))
return;

window.speechSynthesis.cancel();

const voice=
new SpeechSynthesisUtterance(text);

voice.lang=language;
voice.rate=0.85;
voice.pitch=1.05;
voice.volume=1;

window.speechSynthesis.speak(voice);

}
