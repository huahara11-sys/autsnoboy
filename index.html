<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autsnoboy Cheer Test</title>
<style>
body{
font-family:Arial;
text-align:center;
padding:40px 15px;
background:#f2f5ff;
}
button{
font-size:22px;
padding:18px 25px;
border:0;
border-radius:15px;
background:#6257e8;
color:white;
margin:15px;
}
</style>
</head>

<body>

<h1>🦸 Autsnoboy</h1>

<h2>👏 Cheer & Clapping Test</h2>

<button onclick="playCheer()">
🔊 PLAY AUDIENCE CHEER
</button>

<p id="status">Press the button</p>

<audio id="cheer"
src="driken5482-applause-cheer-236786.mp3"
preload="auto"></audio>

<script>

function playCheer(){

const audio=document.getElementById("cheer");

audio.currentTime=0;
audio.volume=1;

audio.play()
.then(function(){

document.getElementById("status").innerText=
"✅ Audience clapping is playing!";

})
.catch(function(error){

document.getElementById("status").innerText=
"❌ Audio error: " + error;

});

}

</script>

</body>
</html>
